<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bedrock" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <title>Bedrock Remote</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #boot {
        position: relative;
        box-sizing: border-box;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 16px 12vh;
        background: radial-gradient(120% 45% at 50% -8%, rgba(14, 44, 90, 0.55), transparent 70%), #000;
      }
      #boot .mascot {
        width: 112px;
        height: 112px;
        border-radius: 22.37%;
        overflow: hidden;
        background: #bce772;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), 0 0 0 0.5px rgba(255, 255, 255, 0.12), 0 0 60px rgba(188, 231, 114, 0.14);
        animation: breathe 3.2s ease-in-out infinite;
      }
      #boot img {
        display: block;
        width: 100%;
        height: 100%;
      }
      #boot p {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      @keyframes breathe {
        50% {
          transform: scale(1.045);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .mascot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-label="Loading Bedrock">
        <div class="mascot"><img src="./icons/bedrock-mascot-512.png" alt="" width="112" height="112" /></div>
        <p>Bedrock</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
