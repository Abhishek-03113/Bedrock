appId: com.bedrock.app
productName: Bedrock
icon: ../../static/icons/bedrock-icon-1024.png
copyright: Copyright © 2026 Bedrock

# Skip native module rebuilding when cross-compiling from macOS to Windows.
# The Castlabs Electron runtime already includes prebuilt native deps.
# If you need native module rebuilding, build on the target platform instead.
npmRebuild: false

# Point to locally installed Castlabs ECS Electron runtime.
# electron-builder will use this instead of downloading from the internet.
# The Castlabs Electron is installed via pnpm from a custom github URL.
electronDist: node_modules/electron/dist

directories:
  output: release

# Application files to bundle into the package.
# electron-builder automatically includes the Castlabs ECS Electron runtime.
files:
  - out/**/*
  - package.json
  # Remote phone UI (HTTP static) — produced by scripts/copy-remote-ui.mjs
  - out/remote/**/*

# Castlabs EVS VMP signing is split by platform because the ordering differs:
#   macOS:   VMP must run BEFORE Apple codesign  -> afterPack (darwin only)
#   Windows: VMP must run AFTER Authenticode     -> afterSign (win32 only)
# Both hooks read BEDROCK_REQUIRE_VMP_SIGNING to decide if failures are fatal.
# See docs/release-ci.md.
afterPack: scripts/vmp-after-pack.mjs
afterSign: scripts/vmp-after-sign.mjs

mac:
  category: public.app-category.entertainment
  target:
    - dmg
    - zip
  # Notarization requires the hardened runtime + entitlements below.
  # Signing happens only if a Developer ID identity is available (CSC_LINK /
  # keychain); notarization happens automatically when APPLE_API_KEY(+_ID,
  # +_ISSUER) or APPLE_ID(+APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) are set.
  # Without them local builds stay unsigned / non-notarized and still work.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

linux:
  category: AudioVideo
  target:
    - AppImage

win:
  target:
    - target: nsis
      arch:
        - x64
  # Windows Authenticode code signing.
  # Set CSC_LINK / CSC_KEY_PASSWORD env vars to sign.
  # Without them the installer is UNSIGNED (acceptable for local/dev testing).
  # See docs/windows-release.md for details.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Ensure the installer can update over an existing installation.
  allowElevation: true
  # Include an uninstaller.
  deleteAppDataOnUninstall: false
